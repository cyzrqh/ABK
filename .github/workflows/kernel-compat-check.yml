name: Kernel compatibility checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/kernel-full-feature-matrix.yml'
      - '.github/workflows/kernel-compat-check.yml'
      - '.github/scripts/fix_sukisu_susfs.py'
      - '.github/scripts/validate_kpm_image.py'
      - '.github/scripts/resolve-ksu-ref.sh'
      - '.github/scripts/read_sukisu_uapi.py'
      - '.github/scripts/pin_sukisu_version.py'
      - '.github/scripts/download-manager-from-actions.sh'
      - 'cli/tests/test_manager_pairing.py'
      - 'cli/tests/test_sukisu_version_metadata.py'
      - 'cli/tests/test_matrix_manager_pairing.py'
      - 'cli/tests/test_kpm_image_integrity.py'
      - 'cli/tests/test_sukisu_susfs_hook_compat.py'
      - 'cli/tests/test_susfs_missing_include.py'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/kernel-full-feature-matrix.yml'
      - '.github/workflows/kernel-compat-check.yml'
      - '.github/scripts/fix_sukisu_susfs.py'
      - '.github/scripts/validate_kpm_image.py'
      - '.github/scripts/resolve-ksu-ref.sh'
      - '.github/scripts/read_sukisu_uapi.py'
      - '.github/scripts/pin_sukisu_version.py'
      - '.github/scripts/download-manager-from-actions.sh'
      - 'cli/tests/test_manager_pairing.py'
      - 'cli/tests/test_sukisu_version_metadata.py'
      - 'cli/tests/test_matrix_manager_pairing.py'
      - 'cli/tests/test_kpm_image_integrity.py'
      - 'cli/tests/test_sukisu_susfs_hook_compat.py'
      - 'cli/tests/test_susfs_missing_include.py'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify C compiler
        run: cc --version
      - name: Test SUSFS headers and kernel hook behavior
        run: |
          python3 -m unittest discover -s cli/tests -p 'test_kpm_image_integrity.py' -v
          python3 -m unittest discover -s cli/tests -p 'test_susfs_missing_include.py' -v
          python3 -m unittest discover -s cli/tests -p 'test_sukisu_susfs_hook_compat.py' -v
          python3 -m unittest discover -s cli/tests -p 'test_sukisu_execve_session.py' -v
          python3 -m unittest discover -s cli/tests -p 'test_kernel_workflow_regressions.py' -v
          python3 -m unittest discover -s cli/tests -p 'test_manager_pairing.py' -v
          python3 -m unittest discover -s cli/tests -p 'test_sukisu_version_metadata.py' -v
          python3 -m unittest discover -s cli/tests -p 'test_matrix_manager_pairing.py' -v
      - name: Read the actual pinned SukiSU source
        id: sukisu-source
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          source = Path('.github/scripts/resolve-ksu-ref.sh').read_text()
          match = re.search(r'^SUKISU_STABLE_REF="([0-9a-f]{40})"', source, re.M)
          if not match:
              raise SystemExit('SukiSU source must be pinned to a full commit SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ref={match[1]}\n')
          PY
      - uses: actions/checkout@v6
        with:
          repository: SukiSU-Ultra/SukiSU-Ultra
          ref: ${{ steps.sukisu-source.outputs.ref }}
          path: .sukisu-source-check
          fetch-depth: 0
      - name: Check real UAPI 6 source compatibility and idempotence
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/.sukisu-source-check"
          test "$(python3 .github/scripts/read_sukisu_uapi.py "$source_dir")" = 6
          python3 .github/scripts/pin_sukisu_version.py "$source_dir"
          python3 .github/scripts/fix_sukisu_susfs.py "$source_dir"
          git -C "$source_dir" diff --no-ext-diff > "$RUNNER_TEMP/sukisu-first.diff"
          python3 .github/scripts/fix_sukisu_susfs.py "$source_dir"
          python3 .github/scripts/pin_sukisu_version.py "$source_dir"
          git -C "$source_dir" diff --no-ext-diff > "$RUNNER_TEMP/sukisu-second.diff"
          cmp "$RUNNER_TEMP/sukisu-first.diff" "$RUNNER_TEMP/sukisu-second.diff"
          # Compatibility work must not fake UAPI 6 or rewrite the native KPM ABI.
          git -C "$source_dir" diff --exit-code -- uapi kernel/extension
